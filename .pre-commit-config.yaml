repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
      - id: plugin-validate
        name: claude plugin validate
        entry: bash -c "claude plugin validate . --strict && claude plugin validate .claude-plugin/plugin.json --strict && claude plugin validate agents --strict && claude plugin validate skills --strict"
        language: system
        pass_filenames: false
        always_run: true
