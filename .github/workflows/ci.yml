name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - name: Validate plugin
        run: |
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate . --strict
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate .claude-plugin/plugin.json --strict
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate agents --strict
          npx -y @anthropic-ai/claude-code@2.1.292 plugin validate skills --strict
        env:
          HOME: ${{ runner.temp }}/claude-home
