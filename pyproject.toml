[project]
name = "devteam-tools"
version = "0.1.0"
description = "Scripts behind the devteam Claude Code plugin."
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "ty==0.0.84"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["skills/team/scripts"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]
src = [".", "skills/team/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "PL", "D", "RUF", "SIM", "PT", "TID"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["skills/team/scripts"]
